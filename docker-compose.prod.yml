services:
  app:
    container_name: ai-novel-architect-prod
    build:
      context: .
      target: prod
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?set OPENAI_BASE_URL in the environment or .env}
      OPENAI_MODEL: ${OPENAI_MODEL:?set OPENAI_MODEL in the environment or .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      # Loopback by default: set APP_BIND=0.0.0.0 to expose it on the LAN.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
