services:
  app:
    container_name: ai-novel-architect-dev
    build:
      context: .
      target: dev
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://llm.lelabs.tech:21434}
      OPENAI_MODEL: ${OPENAI_MODEL:-ornith:9b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Loopback by default: set APP_BIND=0.0.0.0 to expose it on the LAN.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
