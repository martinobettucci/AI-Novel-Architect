services:
  app:
    container_name: ai-novel-architect-dev
    build:
      context: .
      target: dev
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://192.168.0.37:11434}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-oss:20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
